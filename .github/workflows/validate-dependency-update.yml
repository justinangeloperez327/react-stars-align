name: Validate dependency update

on:
  push:
    branches:
      - chore/update-dependencies-2026-10-01
    paths:
      - .github/workflows/validate-dependency-update.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/update-dependencies-2026-10-01

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

# Temporary workflow used only to verify this dependency update.
